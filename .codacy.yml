---
# Test files are validated by running them (go test -race), not by static
# complexity analysis — Lizard's cyclomatic/length rules misfire on
# table-driven tests. Production code stays fully analyzed.
exclude_paths:
  - "**/*_test.go"
  - "*_test.go"
  # The API reference legitimately uses wide config tables (MD060 column
  # alignment) and long descriptive table rows (MD013 line-length), which
  # markdownlint flags; doccov validates its substance instead. README.md
  # stays linted.
  - "docs/**"
